<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLOWDAY — 수험생 스터디 플래너</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%233D8FE0'/><text x='50' y='72' font-size='60' font-weight='bold' text-anchor='middle' fill='white' font-family='sans-serif'>F</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F5F9FD;
  --card:#FFFFFF;
  --ink:#1F3145;
  --sub:#6E8AA3;
  --faint:#9FB8CC;
  --line:#E4EDF5;
  --line2:#D2E2EF;
  --blue:#3D8FE0;
  --blue-dark:#2E7ECB;
  --blue-soft:#EBF4FC;
  --blue-mid:#A9D2F5;
  --kor:#DE6E96; --kor-soft:#FCEBF1;
  --mat:#D6982F; --mat-soft:#FBF1DA;
  --eng:#37A17C; --eng-soft:#E2F4EC;
  --exp:#5F86D8; --exp-soft:#E9EFFB;
  --peach:#E8A254;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--ink);letter-spacing:-.01em;min-height:100vh;
}
button,input{font-family:inherit}
.app{display:flex;min-height:100vh}

/* ================= sidebar ================= */
aside{
  width:232px;flex:none;background:#fff;border-right:1px solid var(--line);
  padding:24px 16px;display:flex;flex-direction:column;gap:22px;
  position:sticky;top:0;height:100vh;
}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--blue);color:#fff;font-style:normal;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.logo b{font-size:15.5px;font-weight:800;letter-spacing:.16em}
.logo b span{color:var(--blue)}
.dday-box{
  background:linear-gradient(150deg,#E7F2FC,#F2F9FF);border:1px solid var(--line2);
  border-radius:10px;padding:16px 14px 14px;
}
.dday-box .exam-name{width:100%;border:none;background:transparent;font-size:12px;font-weight:700;color:var(--sub);outline:none;padding:0 0 2px}
.dday-box .exam-name:focus{color:var(--blue)}
.dday-num{font-size:38px;font-weight:800;letter-spacing:-.03em;color:var(--ink);line-height:1.1}
.dday-num em{font-style:normal;color:var(--blue)}
.dday-box input[type=date]{border:none;background:transparent;font-size:12px;font-weight:600;color:var(--sub);outline:none;cursor:pointer;margin-top:6px;width:100%}
nav{display:flex;flex-direction:column;gap:3px}
nav button{
  display:flex;align-items:center;gap:10px;border:none;background:none;text-align:left;
  font-size:14px;font-weight:600;color:var(--sub);padding:10px 12px;border-radius:8px;cursor:pointer;transition:.15s;
}
nav button:hover{background:#F2F7FC;color:var(--ink)}
nav button.on{background:var(--blue-soft);color:var(--blue);font-weight:700;box-shadow:inset 3px 0 0 var(--blue)}
nav button .ic{width:17px;text-align:center;font-size:14px}
.side-timer{
  margin-top:auto;border:1px solid var(--line2);border-radius:10px;padding:12px 14px;cursor:pointer;
  display:none;transition:.15s;background:#fff;
}
.side-timer:hover{border-color:var(--blue-mid)}
.side-timer.show{display:block}
.side-timer .st1{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--sub);margin-bottom:4px}
.side-timer .st1 i{width:7px;height:7px;border-radius:50%;background:#3CB88A;animation:blink 1.6s infinite}
.side-timer.rest .st1 i{background:var(--peach)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.side-timer .st2{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}

/* ================= main ================= */
main{flex:1;min-width:0;padding:26px 34px 60px;max-width:1080px}
.mhead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.mhead h1{font-size:23px;font-weight:800;letter-spacing:-.02em}
.mhead .today-chip{font-size:12.5px;font-weight:600;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:7px;padding:7px 13px}
.view{display:none}
.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}

/* ---- date strip ---- */
.dstrip{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.dstrip .arrow{width:32px;height:44px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--sub);cursor:pointer;font-size:13px}
.dstrip .arrow:hover{border-color:var(--blue-mid);color:var(--blue)}
.dstrip .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;flex:1}
.dstrip .d{
  border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 2px;text-align:center;cursor:pointer;transition:.12s;position:relative;
}
.dstrip .d:hover{border-color:var(--line2)}
.dstrip .d .w{font-size:10px;font-weight:700;color:var(--faint)}
.dstrip .d .n{font-size:14.5px;font-weight:800;color:var(--sub)}
.dstrip .d .c{font-size:9.5px;font-weight:700;color:var(--faint);min-height:12px}
.dstrip .d.sel{border-color:var(--blue);background:var(--blue-soft)}
.dstrip .d.sel .n{color:var(--blue)}
.dstrip .d.today::after{content:'';position:absolute;top:5px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--blue)}
.dstrip .d.full .c{color:var(--eng)}

/* ---- stat line ---- */
.statline{display:flex;align-items:center;gap:20px;padding:13px 18px;margin-bottom:14px;font-size:13px;font-weight:600;color:var(--sub);flex-wrap:wrap}
.statline .grow{flex:1;display:flex;align-items:center;gap:10px;min-width:180px}
.statline .bar{flex:1;height:7px;background:#EAF1F8;border-radius:3px;overflow:hidden}
.statline .bar i{display:block;height:100%;background:var(--blue);border-radius:3px;width:0;transition:width .4s}
.statline b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.statline .divv{width:1px;height:16px;background:var(--line)}
.statline .clear-btn{border:none;background:none;font-size:12.5px;font-weight:600;color:var(--faint);cursor:pointer;margin-left:auto}
.statline .clear-btn:hover{color:var(--blue)}

/* ---- timer band ---- */
.timer-band{display:flex;align-items:center;gap:22px;padding:20px 24px;margin-bottom:16px;flex-wrap:wrap}
.tb-left{display:flex;flex-direction:column;gap:9px;min-width:150px}
.tb-label{font-size:11px;font-weight:800;color:var(--faint);letter-spacing:.12em}
.tb-chips{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tb-chips button{
  border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 10px;font-size:12.5px;font-weight:700;color:var(--sub);cursor:pointer;transition:.12s;text-align:left;
}
.tb-chips button:hover{border-color:var(--line2)}
.tb-chips button.on{border-color:currentColor;background:var(--chipbg,#fff)}
.tb-center{flex:1;text-align:center;min-width:220px}
.tb-time{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.05}
.tb-sub{font-size:12.5px;font-weight:700;color:var(--sub);margin-top:3px}
.tb-sub .rest{color:var(--peach)}
.tb-right{display:flex;flex-direction:column;gap:8px;min-width:120px}
.btn{border:none;border-radius:8px;font-size:13.5px;font-weight:700;padding:11px 18px;cursor:pointer;transition:.12s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-dark)}
.btn-ghost{background:#fff;border:1px solid var(--line2);color:var(--sub)}
.btn-ghost:hover{border-color:var(--blue-mid);color:var(--blue)}
.btn-peach{background:#FBF0E1;color:var(--peach)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---- kanban ---- */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
.kcol{padding:14px;display:flex;flex-direction:column;gap:8px}
.kcol-head{display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:2px}
.kcol-head i{width:8px;height:8px;border-radius:2px}
.kcol-head b{font-size:13.5px;font-weight:800}
.kcol-head span{margin-left:auto;font-size:11px;font-weight:700;color:var(--faint)}
.tk{
  border:1px solid var(--line);border-left:3px solid var(--kc,#ccc);border-radius:7px;background:#fff;
  padding:9px 10px;display:flex;align-items:flex-start;gap:8px;transition:.12s;
}
.tk:hover{border-color:var(--line2);border-left-color:var(--kc)}
.tk.done{opacity:.55}
.tk.done .txt{text-decoration:line-through;color:var(--faint)}
.tk input[type=checkbox]{
  appearance:none;width:17px;height:17px;flex:none;border:1.5px solid var(--line2);border-radius:4px;cursor:pointer;position:relative;background:#fff;margin-top:1px;
}
.tk input[type=checkbox]:checked{background:var(--kc);border-color:var(--kc)}
.tk input[type=checkbox]:checked::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800}
.tk .txt{flex:1;font-size:13px;font-weight:600;line-height:1.45;word-break:break-all}
.tk .txt[contenteditable=true]{outline:1.5px solid var(--blue-mid);border-radius:4px;padding:0 3px;background:#fff}
.tk .carry{font-size:9px;font-weight:800;color:var(--blue);background:var(--blue-soft);border-radius:4px;padding:2px 5px;flex:none;margin-top:2px}
.tk .acts{display:flex;flex-direction:row;gap:1px;opacity:0;transition:.12s;flex:none}
.tk:hover .acts{opacity:1}
.tk .acts button{border:none;background:none;color:var(--faint);font-size:11px;font-weight:700;cursor:pointer;padding:2px 4px;border-radius:4px}
.tk .acts button:hover{background:#F0F6FC;color:var(--ink)}
.kadd{display:flex;gap:5px}
.kadd input{flex:1;min-width:0;border:1px dashed var(--line2);border-radius:7px;padding:8px 10px;font-size:12.5px;font-weight:600;outline:none;background:transparent;color:var(--ink)}
.kadd input::placeholder{color:var(--faint)}
.kadd input:focus{border-color:var(--blue-mid);border-style:solid}
.kadd button{border:none;background:var(--blue-soft);color:var(--blue);border-radius:7px;font-size:12px;font-weight:700;padding:0 11px;cursor:pointer}
.kadd button:hover{background:var(--blue-mid);color:#fff}

/* ---- week view ---- */
.wk-top{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:14px;font-size:13px;font-weight:700;color:var(--sub)}
.wk-top .bar{flex:1;height:7px;background:#EAF1F8;border-radius:3px;overflow:hidden}
.wk-top .bar i{display:block;height:100%;background:var(--blue);border-radius:3px;width:0;transition:width .4s}
.wk-top b{color:var(--ink);font-variant-numeric:tabular-nums}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wcard{padding:16px;display:flex;flex-direction:column;gap:8px}
.wcard-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.wcard-head i{width:8px;height:8px;border-radius:2px}
.wcard-head b{font-size:14px;font-weight:800}
.wcard-head span{margin-left:auto;font-size:11px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
.wcard .gbar{height:4px;background:#EAF1F8;border-radius:2px;overflow:hidden;margin-bottom:6px}
.wcard .gbar i{display:block;height:100%;border-radius:2px;width:0;transition:width .4s}
.goal{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.goal input[type=checkbox]{appearance:none;width:16px;height:16px;flex:none;border:1.5px solid var(--line2);border-radius:4px;cursor:pointer;position:relative;background:#fff}
.goal input[type=checkbox]:checked::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:800}
.goal.done span{text-decoration:line-through;color:var(--faint)}
.goal span{flex:1;word-break:break-all}
.goal button{border:none;background:none;color:transparent;font-size:11px;cursor:pointer;padding:2px 4px}
.goal:hover button{color:var(--faint)}
.goal button:hover{color:var(--kor)}

/* ---- log view ---- */
.log-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:12px;align-items:start}
.log-card{padding:18px}
.log-card h3{font-size:13px;font-weight:800;color:var(--sub);margin-bottom:14px;display:flex;align-items:center}
.log-card h3 .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.log-card h3 .total{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.log-card h3 button{border:1px solid var(--line2);background:#fff;border-radius:6px;font-size:11px;font-weight:700;color:var(--sub);padding:5px 10px;cursor:pointer}
.log-card h3 button:hover{border-color:var(--blue-mid);color:var(--blue)}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;padding:0 2px}
.chart .colwrap{display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:pointer;border-radius:6px;padding:4px 6px 0;transition:.12s}
.chart .colwrap:hover{background:#F2F8FD}
.chart .colwrap.sel{background:var(--blue-soft)}
.chart .stack{display:flex;flex-direction:column-reverse;gap:1px;min-height:2px}
.chart .stack i{display:block;border-radius:2px}
.chart .base{height:2px;background:var(--line2);border-radius:2px;margin-top:2px}
.chart-x{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:8px 2px 0;text-align:center}
.chart-x div{font-size:10.5px;font-weight:700;color:var(--faint)}
.chart-x div b{display:block;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.chart-x div.sel b{color:var(--blue)}
.strip{display:grid;grid-template-columns:repeat(48,1fr);gap:1.5px;margin-bottom:5px}
.strip i{height:20px;border-radius:2px;background:#EFF5FA}
.strip-x{display:flex;justify-content:space-between;font-size:9.5px;font-weight:700;color:var(--faint);margin-bottom:16px}
.subj-rows{display:flex;flex-direction:column;gap:7px}
.subj-rows .r{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:var(--sub)}
.subj-rows .r i{width:8px;height:8px;border-radius:2px}
.subj-rows .r b{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums}
.subj-rows .r .rb{flex:1;height:4px;background:#EAF1F8;border-radius:2px;overflow:hidden;max-width:160px}
.subj-rows .r .rb i{display:block;width:0;height:100%;border-radius:2px}
.log-meta{font-size:12px;font-weight:600;color:var(--faint);margin-top:14px}

/* ---- mock view ---- */
.mock-wrap{display:grid;grid-template-columns:1fr 300px;gap:12px;align-items:start;max-width:820px}
.mock-card{padding:18px}
.mrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-left:3px solid var(--kc);border-radius:7px;padding:12px 14px;cursor:pointer;transition:.12s;background:#fff}
.mrow+.mrow{margin-top:8px}
.mrow:hover{border-color:var(--line2);border-left-color:var(--kc)}
.mrow.on{background:var(--blue-soft);border-color:var(--blue);border-left-color:var(--kc)}
.mrow b{font-size:13.5px;font-weight:800}
.mrow .min{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--sub)}
.mrow input{width:48px;border:1px solid var(--line);background:#fff;border-radius:5px;font-size:12px;font-weight:700;text-align:right;padding:3px 6px;outline:none;color:var(--ink)}
.mrow input:focus{border-color:var(--blue-mid)}
.mock-right{padding:20px;text-align:center}
.ring-wrap{position:relative;width:180px;height:180px;margin:4px auto 14px}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.ring-inner .rs{font-size:11.5px;font-weight:800;color:var(--sub)}
.ring-inner .rt{font-size:33px;font-weight:800;font-variant-numeric:tabular-nums}
.mock-btns{display:flex;justify-content:center;gap:7px}
.voice-btn{margin-top:12px;border:1px solid var(--line2);background:#fff;border-radius:7px;font-size:11.5px;font-weight:700;color:var(--faint);padding:7px 13px;cursor:pointer}
.voice-btn.on{background:var(--eng-soft);color:var(--eng);border-color:#BFE5D6}

/* ---- modal / toast ---- */
.modal-bg{position:fixed;inset:0;background:rgba(25,45,65,.4);display:none;align-items:center;justify-content:center;z-index:50}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;width:min(380px,92vw)}
.modal h3{font-size:16px;font-weight:800;margin-bottom:16px}
.modal .m-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.modal .m-row i{width:8px;height:8px;border-radius:2px}
.modal .m-row b{flex:1;font-size:13.5px;font-weight:700}
.modal .m-row input{width:84px;border:1px solid var(--line2);border-radius:7px;font-size:13.5px;font-weight:700;padding:8px 10px;outline:none;text-align:right;color:var(--ink)}
.modal .m-row input:focus{border-color:var(--blue-mid)}
.modal .m-row span{font-size:12px;color:var(--faint);font-weight:700}
.modal-btns{display:flex;gap:7px;justify-content:flex-end;margin-top:18px}
.btn-sm{padding:9px 15px;font-size:12.5px;border-radius:7px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;font-size:13px;font-weight:700;border-radius:8px;padding:11px 20px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:960px){
  .app{flex-direction:column}
  aside{width:100%;height:auto;position:static;flex-direction:row;align-items:center;gap:14px;padding:12px 16px;border-right:none;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .dday-box{padding:8px 12px;display:flex;align-items:center;gap:10px}
  .dday-box .exam-name{width:80px;padding:0}
  .dday-num{font-size:22px}
  .dday-box input[type=date]{display:none}
  nav{flex-direction:row;gap:2px;margin-left:auto}
  nav button{padding:8px 10px;font-size:13px}
  nav button.on{box-shadow:inset 0 -2px 0 var(--blue)}
  .side-timer{margin:0}
  main{padding:20px 16px 50px}
  .kanban{grid-template-columns:1fr 1fr}
  .log-grid{grid-template-columns:1fr}
  .mock-wrap{grid-template-columns:1fr}
}
@media(max-width:560px){
  .kanban{grid-template-columns:1fr}
  .wgrid{grid-template-columns:1fr}
  .tb-center{order:-1;width:100%}
  .timer-band{gap:14px}
}
</style>
</head>
<body>
<div class="app">

<aside>
  <div class="logo"><i>F</i><b>FLOW<span>DAY</span></b></div>
  <div class="dday-box">
    <input class="exam-name" id="examName" value="2027 수능" spellcheck="false">
    <div class="dday-num" id="ddayNum">D-<em>0</em></div>
    <input type="date" id="examDate">
  </div>
  <nav>
    <button data-view="today" class="on"><span class="ic">☐</span>오늘</button>
    <button data-view="week"><span class="ic">≡</span>주간 목표</button>
    <button data-view="log"><span class="ic">▥</span>공부 기록</button>
    <button data-view="mock"><span class="ic">◔</span>모의고사</button>
  </nav>
  <div class="side-timer" id="sideTimer">
    <div class="st1"><i></i><span id="stLabel">집중 중</span></div>
    <div class="st2" id="stTime">00:00:00</div>
  </div>
</aside>

<main>
  <div class="mhead">
    <h1 id="viewTitle">오늘</h1>
    <div class="today-chip" id="todayChip"></div>
  </div>

  <!-- ============ TODAY ============ -->
  <section class="view on" id="view-today">
    <div class="dstrip">
      <button class="arrow" id="wkPrev">←</button>
      <div class="days" id="wkDays"></div>
      <button class="arrow" id="wkNext">→</button>
    </div>

    <div class="card statline">
      <div class="grow">달성률 <div class="bar"><i id="rateFill"></i></div> <b id="rateTxt">0/0</b></div>
      <div class="divv"></div>
      <div>공부 <b id="todayStudy">0분</b></div>
      <div class="divv"></div>
      <div>세션 <b id="sessionCount">0회</b></div>
      <button class="clear-btn" id="clearDone">완료 항목 지우기</button>
    </div>

    <div class="card timer-band">
      <div class="tb-left">
        <div class="tb-label">FOCUS</div>
        <div class="tb-chips" id="tbChips"></div>
      </div>
      <div class="tb-center">
        <div class="tb-time" id="tbTime">00:00:00</div>
        <div class="tb-sub"><span id="tbSubj">국어</span> · <span id="tbState">대기</span><span class="rest" id="tbRest"></span></div>
      </div>
      <div class="tb-right">
        <button class="btn btn-primary" id="btnSession">세션 시작</button>
        <button class="btn btn-peach" id="btnRest" style="display:none">휴식</button>
        <button class="btn btn-ghost" id="btnEnd" disabled>공부 종료</button>
      </div>
    </div>

    <div class="kanban" id="kanban"></div>
  </section>

  <!-- ============ WEEK ============ -->
  <section class="view" id="view-week">
    <div class="card wk-top">
      <span>주간 목표</span>
      <div class="bar"><i id="wkGoalFill"></i></div>
      <b id="wkGoalCount">0/0</b>
    </div>
    <div class="wgrid" id="wgrid"></div>
  </section>

  <!-- ============ LOG ============ -->
  <section class="view" id="view-log">
    <div class="log-grid">
      <div class="card log-card">
        <h3>이번 주 공부량</h3>
        <div class="chart" id="chart"></div>
        <div class="chart-x" id="chartX"></div>
      </div>
      <div class="card log-card">
        <h3><span id="logDayTitle">오늘</span>
          <span class="right"><span class="total" id="logTotal">0분</span><button id="editLog">기록 편집</button></span>
        </h3>
        <div class="strip" id="strip"></div>
        <div class="strip-x"><span>06</span><span>09</span><span>12</span><span>15</span><span>18</span><span>21</span><span>24</span></div>
        <div class="subj-rows" id="subjRows"></div>
        <div class="log-meta" id="logMeta"></div>
      </div>
    </div>
  </section>

  <!-- ============ MOCK ============ -->
  <section class="view" id="view-mock">
    <div class="mock-wrap">
      <div class="card mock-card" id="mockList"></div>
      <div class="card mock-right">
        <div class="ring-wrap">
          <svg width="180" height="180" viewBox="0 0 180 180">
            <circle cx="90" cy="90" r="80" fill="none" stroke="#EAF1F8" stroke-width="9"/>
            <circle id="mockArc" cx="90" cy="90" r="80" fill="none" stroke="#3D8FE0" stroke-width="9" stroke-linecap="butt" stroke-dasharray="502.7" stroke-dashoffset="0" style="transition:stroke-dashoffset .4s linear"/>
          </svg>
          <div class="ring-inner">
            <div class="rs" id="mockSubjLabel">국어</div>
            <div class="rt" id="mockTime">80:00</div>
          </div>
        </div>
        <div class="mock-btns">
          <button class="btn btn-primary btn-sm" id="mockStart">시작</button>
          <button class="btn btn-ghost btn-sm" id="mockReset">초기화</button>
        </div>
        <button class="voice-btn on" id="voiceBtn">음성 알림 켜짐</button>
      </div>
    </div>
  </section>
</main>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>공부 기록 편집</h3>
    <div id="modalRows"></div>
    <div class="modal-btns">
      <button class="btn btn-ghost btn-sm" id="modalCancel">취소</button>
      <button class="btn btn-primary btn-sm" id="modalSave">저장</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';

/* ---------- constants ---------- */
const SUBJECTS = [
  {key:'kor', name:'국어', hex:'#DE6E96', soft:'#FCEBF1'},
  {key:'mat', name:'수학', hex:'#D6982F', soft:'#FBF1DA'},
  {key:'eng', name:'영어', hex:'#37A17C', soft:'#E2F4EC'},
  {key:'exp', name:'탐구', hex:'#5F86D8', soft:'#E9EFFB'},
];
const SUBJ = Object.fromEntries(SUBJECTS.map(s=>[s.key,s]));
const DOW = ['일','월','화','수','목','금','토'];

/* ---------- storage ---------- */
function loadState(){
  try{ const raw = localStorage.getItem('flowday-v2'); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function saveState(){ try{ localStorage.setItem('flowday-v2', JSON.stringify(S)); }catch(e){} }
const DEFAULTS = {
  examName:'2027 수능', examDate:'2026-11-19',
  tasks:{}, weekly:{}, log:{}, segs:{}, sessions:{},
  mock:{ durations:{kor:80,mat:100,eng:70,exp:30}, voice:true },
  timer:null, lastCarry:null,
};
let S = Object.assign({}, DEFAULTS, loadState()||{});
S.mock = Object.assign({}, DEFAULTS.mock, S.mock||{});
S.mock.durations = Object.assign({}, DEFAULTS.mock.durations, S.mock.durations||{});

/* ---------- utils ---------- */
const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse = s => { const [y,m,dd]=s.split('-').map(Number); return new Date(y,m-1,dd); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => { const x=new Date(d); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; };
const todayStr = () => fmt(new Date());
const pad = n => String(n).padStart(2,'0');
const hms = sec => { sec=Math.max(0,Math.floor(sec)); return `${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`; };
const minLabel = sec => {
  const m = Math.round(sec/60);
  if(m<60) return `${m}분`;
  return m%60===0 ? `${Math.floor(m/60)}시간` : `${Math.floor(m/60)}시간 ${m%60}분`;
};
const $ = id => document.getElementById(id);
const uid = () => 't'+Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const esc = s => s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

function dayTasks(date){ if(!S.tasks[date]) S.tasks[date]={kor:[],mat:[],eng:[],exp:[]}; SUBJECTS.forEach(s=>{ if(!S.tasks[date][s.key]) S.tasks[date][s.key]=[]; }); return S.tasks[date]; }
function dayLog(date){ if(!S.log[date]) S.log[date]={kor:0,mat:0,eng:0,exp:0}; return S.log[date]; }
function weekKey(d){ return fmt(monday(d)); }
function weekGoals(k){ if(!S.weekly[k]) S.weekly[k]={kor:[],mat:[],eng:[],exp:[]}; SUBJECTS.forEach(s=>{ if(!S.weekly[k][s.key]) S.weekly[k][s.key]=[]; }); return S.weekly[k]; }
function countDay(date){
  const t = S.tasks[date]; let done=0,total=0;
  if(t) SUBJECTS.forEach(s=>(t[s.key]||[]).forEach(x=>{ total++; if(x.done) done++; }));
  return {done,total};
}
function dayTotalSec(date){ const l=S.log[date]; if(!l) return 0; return SUBJECTS.reduce((a,s)=>a+(l[s.key]||0),0); }
function liveSessionSec(){ if(!S.timer) return 0; let t=S.timer.accum; if(!S.timer.onBreak) t+=(Date.now()-S.timer.startTs)/1000; return t; }
function liveBreakSec(){ if(!S.timer) return 0; let t=S.timer.breakAccum; if(S.timer.onBreak) t+=(Date.now()-S.timer.breakStartTs)/1000; return t; }
function liveFor(date,subj){ return (S.timer && S.timer.date===date && (!subj || S.timer.subj===subj)) ? liveSessionSec() : 0; }

/* ---------- carryover ---------- */
function carryOver(){
  const today = todayStr();
  if(S.lastCarry === today) return;
  const y = fmt(addDays(new Date(),-1));
  const yt = S.tasks[y];
  if(yt){
    const tt = dayTasks(today);
    SUBJECTS.forEach(s=>{
      (yt[s.key]||[]).forEach(x=>{
        if(!x.done && !x.movedOn){ tt[s.key].push({id:uid(),text:x.text,done:false,carry:true}); x.movedOn=today; }
      });
    });
  }
  S.lastCarry = today; saveState();
}

/* ---------- app ui state ---------- */
let view = 'today';
let selDate = todayStr();
let weekAnchor = monday(new Date());
let logDate = todayStr();
let focusSubj = S.timer ? S.timer.subj : 'kor';
let mockSubj = 'kor';
let mockTimer = null;

/* ---------- view switching ---------- */
const VIEW_TITLES = {today:'', week:'주간 목표', log:'공부 기록', mock:'모의고사'};
document.querySelectorAll('nav button').forEach(b=>{
  b.onclick = ()=>{
    view = b.dataset.view;
    document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on', x===b));
    document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on', v.id==='view-'+view));
    renderTitle(); renderCurrent();
  };
});
function renderTitle(){
  if(view==='today'){
    const d = parse(selDate);
    $('viewTitle').textContent = `${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`;
  }else if(view==='week'){
    const m = monday(new Date()), e = addDays(m,6);
    $('viewTitle').textContent = `주간 목표 · ${m.getMonth()+1}.${m.getDate()} – ${e.getMonth()+1}.${e.getDate()}`;
  }else $('viewTitle').textContent = VIEW_TITLES[view];
}
function renderCurrent(){
  if(view==='today'){ renderStrip(); renderStat(); renderTimer(); renderKanban(); }
  else if(view==='week') renderWeek();
  else if(view==='log') renderLog();
  else if(view==='mock') renderMock();
}

/* ---------- header / dday ---------- */
function renderChrome(){
  const n = new Date();
  $('todayChip').textContent = `${n.getMonth()+1}월 ${n.getDate()}일 ${DOW[n.getDay()]}요일`;
  $('examName').value = S.examName;
  $('examDate').value = S.examDate;
  const diff = Math.ceil((parse(S.examDate)-parse(todayStr()))/86400000);
  $('ddayNum').innerHTML = diff>0 ? `D-<em>${diff}</em>` : diff===0 ? `<em>D-DAY</em>` : `D+<em>${-diff}</em>`;
}
$('examName').onchange = e=>{ S.examName=e.target.value.trim()||'나의 시험'; saveState(); };
$('examDate').onchange = e=>{ if(e.target.value){ S.examDate=e.target.value; saveState(); renderChrome(); } };

/* ---------- date strip ---------- */
function renderStrip(){
  const wrap = $('wkDays'); wrap.innerHTML='';
  for(let i=0;i<7;i++){
    const d = addDays(weekAnchor,i), ds = fmt(d);
    const {done,total} = countDay(ds);
    const el = document.createElement('div');
    el.className = 'd'+(ds===selDate?' sel':'')+(ds===todayStr()?' today':'')+(total>0&&done===total?' full':'');
    el.innerHTML = `<div class="w">${DOW[d.getDay()]}</div><div class="n">${d.getDate()}</div><div class="c">${total?`${done}/${total}`:''}</div>`;
    el.onclick = ()=>{ selDate=ds; renderTitle(); renderStrip(); renderStat(); renderKanban(); };
    wrap.appendChild(el);
  }
}
$('wkPrev').onclick = ()=>{ weekAnchor=addDays(weekAnchor,-7); selDate=fmt(weekAnchor); renderTitle(); renderStrip(); renderStat(); renderKanban(); };
$('wkNext').onclick = ()=>{ weekAnchor=addDays(weekAnchor,7); selDate=fmt(weekAnchor); renderTitle(); renderStrip(); renderStat(); renderKanban(); };
$('clearDone').onclick = ()=>{
  const t = dayTasks(selDate);
  SUBJECTS.forEach(s=>{ t[s.key]=t[s.key].filter(x=>!x.done); });
  saveState(); renderStrip(); renderStat(); renderKanban();
};

/* ---------- stat line ---------- */
function renderStat(){
  const {done,total} = countDay(selDate);
  $('rateFill').style.width = total? (done/total*100)+'%' : '0%';
  $('rateTxt').textContent = `${done}/${total}`;
  const base = dayTotalSec(todayStr()) + liveFor(todayStr());
  $('todayStudy').textContent = minLabel(base);
  $('sessionCount').textContent = (S.sessions[todayStr()]||0)+'회';
}

/* ---------- kanban ---------- */
function renderKanban(){
  const t = dayTasks(selDate);
  const wrap = $('kanban'); wrap.innerHTML='';
  SUBJECTS.forEach(s=>{
    const list = t[s.key];
    const col = document.createElement('div');
    col.className = 'card kcol';
    col.innerHTML = `
      <div class="kcol-head"><i style="background:${s.hex}"></i><b>${s.name}</b><span>${list.filter(x=>x.done).length}/${list.length}</span></div>
      <div class="klist"></div>
      <div class="kadd"><input placeholder="할 일 추가" maxlength="80"><button>+</button></div>`;
    const klist = col.querySelector('.klist');
    klist.style.display='flex'; klist.style.flexDirection='column'; klist.style.gap='7px';
    list.forEach((x,idx)=>{
      const el = document.createElement('div');
      el.className = 'tk'+(x.done?' done':'');
      el.style.setProperty('--kc', s.hex);
      el.innerHTML = `
        <input type="checkbox" ${x.done?'checked':''}>
        <span class="txt">${esc(x.text)}</span>
        ${x.carry?'<span class="carry">이월</span>':''}
        <div class="acts"><button class="up">↑</button><button class="dn">↓</button><button class="ed">✎</button><button class="del">✕</button></div>`;
      el.querySelector('input').onchange = e=>{ x.done=e.target.checked; saveState(); renderStrip(); renderStat(); renderKanban(); };
      el.querySelector('.up').onclick = ()=>{ if(idx>0){ [list[idx-1],list[idx]]=[list[idx],list[idx-1]]; saveState(); renderKanban(); } };
      el.querySelector('.dn').onclick = ()=>{ if(idx<list.length-1){ [list[idx+1],list[idx]]=[list[idx],list[idx+1]]; saveState(); renderKanban(); } };
      el.querySelector('.del').onclick = ()=>{ list.splice(idx,1); saveState(); renderStrip(); renderStat(); renderKanban(); };
      el.querySelector('.ed').onclick = ()=>{
        const span = el.querySelector('.txt');
        span.contentEditable='true'; span.focus();
        const finish = ()=>{ span.contentEditable='false'; const v=span.textContent.trim(); if(v) x.text=v; saveState(); renderKanban(); };
        span.onblur = finish;
        span.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); span.blur(); } if(e.key==='Escape'){ span.textContent=x.text; span.blur(); } };
      };
      klist.appendChild(el);
    });
    const inp = col.querySelector('.kadd input');
    const doAdd = ()=>{ const v=inp.value.trim(); if(!v) return; list.push({id:uid(),text:v,done:false}); inp.value=''; saveState(); renderStrip(); renderStat(); renderKanban();
      wrap.querySelectorAll('.kadd input')[SUBJECTS.indexOf(s)].focus(); };
    col.querySelector('.kadd button').onclick = doAdd;
    inp.onkeydown = e=>{ if(e.key==='Enter') doAdd(); };
    wrap.appendChild(col);
  });
}

/* ---------- focus timer ---------- */
function renderTimer(){
  const wrap = $('tbChips'); wrap.innerHTML='';
  SUBJECTS.forEach(s=>{
    const b = document.createElement('button');
    b.textContent = s.name;
    if(focusSubj===s.key){ b.className='on'; b.style.color=s.hex; b.style.setProperty('--chipbg', s.soft); }
    b.onclick = ()=>{ if(S.timer && S.timer.subj!==s.key) endSession(true); focusSubj=s.key; renderTimer(); };
    wrap.appendChild(b);
  });
  const s = SUBJ[focusSubj];
  $('tbSubj').textContent = s.name;
  $('tbSubj').style.color = s.hex;
  if(S.timer){
    $('btnSession').textContent = '새 세션';
    $('btnRest').style.display = '';
    $('btnRest').textContent = S.timer.onBreak ? '재개' : '휴식';
    $('btnEnd').disabled = false;
    $('tbState').textContent = S.timer.onBreak ? '휴식 중' : '집중 중';
  }else{
    $('btnSession').textContent = '세션 시작';
    $('btnRest').style.display = 'none';
    $('btnEnd').disabled = true;
    $('tbState').textContent = '대기';
  }
  tick();
}
function tick(){
  $('tbTime').textContent = hms(liveSessionSec());
  $('tbRest').textContent = S.timer && liveBreakSec()>0 ? ` · 휴식 ${hms(liveBreakSec())}` : '';
  // sidebar mini
  const st = $('sideTimer');
  if(S.timer){
    st.classList.add('show'); st.classList.toggle('rest', !!S.timer.onBreak);
    $('stLabel').textContent = SUBJ[S.timer.subj].name + (S.timer.onBreak?' · 휴식':' · 집중');
    $('stTime').textContent = hms(liveSessionSec());
  }else st.classList.remove('show');
}
$('sideTimer').onclick = ()=>{ document.querySelector('nav button[data-view=today]').click(); };
function startSession(){
  if(S.timer) endSession(true);
  S.timer = {subj:focusSubj, startTs:Date.now(), accum:0, onBreak:false, breakStartTs:0, breakAccum:0, date:todayStr()};
  saveState(); renderTimer();
}
function toggleBreak(){
  if(!S.timer) return;
  const now = Date.now();
  if(S.timer.onBreak){ S.timer.breakAccum+=(now-S.timer.breakStartTs)/1000; S.timer.onBreak=false; S.timer.startTs=now; }
  else{ S.timer.accum+=(now-S.timer.startTs)/1000; S.timer.onBreak=true; S.timer.breakStartTs=now; }
  saveState(); renderTimer();
}
function endSession(silent){
  if(!S.timer) return;
  const sec = liveSessionSec(); const t = S.timer;
  if(sec>=5){
    const l = dayLog(t.date);
    l[t.subj]=(l[t.subj]||0)+sec;
    S.sessions[t.date]=(S.sessions[t.date]||0)+1;
    if(!S.segs[t.date]) S.segs[t.date]=[];
    const endSec = Math.min(86400,(Date.now()-parse(t.date).getTime())/1000);
    const startSec = Math.max(0, endSec-(sec+liveBreakSec()));
    S.segs[t.date].push({s:Math.floor(startSec), e:Math.floor(endSec), subj:t.subj});
    if(!silent) toast(`${minLabel(sec)} 기록 완료`);
  }
  S.timer=null; saveState(); renderTimer(); renderStat();
}
$('btnSession').onclick = startSession;
$('btnRest').onclick = toggleBreak;
$('btnEnd').onclick = ()=>endSession(false);

/* ---------- week view ---------- */
function renderWeek(){
  const k = weekKey(new Date());
  const g = weekGoals(k);
  let done=0,total=0;
  SUBJECTS.forEach(s=>g[s.key].forEach(x=>{ total++; if(x.done) done++; }));
  $('wkGoalCount').textContent = `${done}/${total}`;
  $('wkGoalFill').style.width = total? (done/total*100)+'%' : '0%';
  const wrap = $('wgrid'); wrap.innerHTML='';
  SUBJECTS.forEach(s=>{
    const list = g[s.key];
    const dn = list.filter(x=>x.done).length;
    const card = document.createElement('div');
    card.className='card wcard';
    card.innerHTML = `
      <div class="wcard-head"><i style="background:${s.hex}"></i><b>${s.name}</b><span>${dn}/${list.length}</span></div>
      <div class="gbar"><i style="background:${s.hex};width:${list.length?dn/list.length*100:0}%"></i></div>
      <div class="goals" style="display:flex;flex-direction:column;gap:7px"></div>
      <div class="kadd" style="margin-top:4px"><input placeholder="목표 추가" maxlength="60"><button>+</button></div>`;
    const goals = card.querySelector('.goals');
    list.forEach((x,idx)=>{
      const row = document.createElement('div');
      row.className='goal'+(x.done?' done':'');
      row.innerHTML = `<input type="checkbox" ${x.done?'checked':''}><span>${esc(x.text)}</span><button>✕</button>`;
      const cb = row.querySelector('input');
      if(cb.checked){ cb.style.background=s.hex; cb.style.borderColor=s.hex; }
      cb.onchange = ()=>{ x.done=cb.checked; saveState(); renderWeek(); };
      row.querySelector('button').onclick = ()=>{ list.splice(idx,1); saveState(); renderWeek(); };
      goals.appendChild(row);
    });
    const inp = card.querySelector('.kadd input');
    const doAdd = ()=>{ const v=inp.value.trim(); if(!v) return; list.push({id:uid(),text:v,done:false}); inp.value=''; saveState(); renderWeek(); };
    card.querySelector('.kadd button').onclick = doAdd;
    inp.onkeydown = e=>{ if(e.key==='Enter') doAdd(); };
    wrap.appendChild(card);
  });
}

/* ---------- log view ---------- */
function renderLog(){
  const m = monday(new Date());
  const days = [...Array(7)].map((_,i)=>fmt(addDays(m,i)));
  const totals = days.map(ds=>dayTotalSec(ds)+liveFor(ds));
  const max = Math.max(3600, ...totals);
  const chart = $('chart'); chart.innerHTML='';
  const chartX = $('chartX'); chartX.innerHTML='';
  days.forEach((ds,i)=>{
    const col = document.createElement('div');
    col.className = 'colwrap'+(ds===logDate?' sel':'');
    const l = dayLog(ds);
    let inner = '';
    SUBJECTS.forEach(su=>{
      let v = (l[su.key]||0) + liveFor(ds,su.key);
      if(v>0) inner += `<i style="height:${Math.max(2,v/max*128)}px;background:${su.hex}"></i>`;
    });
    col.innerHTML = `<div class="stack">${inner}</div><div class="base"></div>`;
    col.onclick = ()=>{ logDate=ds; renderLog(); };
    chart.appendChild(col);
    const d = parse(ds);
    const xl = document.createElement('div');
    if(ds===logDate) xl.className='sel';
    xl.innerHTML = `${DOW[d.getDay()]} ${d.getDate()}<b>${totals[i]>0?minLabel(totals[i]):'·'}</b>`;
    chartX.appendChild(xl);
  });
  // right panel
  const d = parse(logDate);
  $('logDayTitle').textContent = `${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}`;
  const tot = dayTotalSec(logDate)+liveFor(logDate);
  $('logTotal').textContent = minLabel(tot);
  const strip = $('strip'); strip.innerHTML='';
  const segsArr = (S.segs[logDate]||[]).slice();
  if(S.timer && S.timer.date===logDate){
    const nowSec = (Date.now()-parse(logDate).getTime())/1000;
    segsArr.push({s:nowSec-liveSessionSec()-liveBreakSec(), e:nowSec, subj:S.timer.subj});
  }
  const START=6*3600, CELL=(18*3600)/48;
  for(let i=0;i<48;i++){
    const cs=START+i*CELL, ce=cs+CELL;
    const cell=document.createElement('i');
    const hit=segsArr.find(g=>g.s<ce && g.e>cs);
    if(hit) cell.style.background = SUBJ[hit.subj].hex;
    strip.appendChild(cell);
  }
  const rows = $('subjRows'); rows.innerHTML='';
  const l = dayLog(logDate);
  SUBJECTS.forEach(su=>{
    let v = (l[su.key]||0)+liveFor(logDate,su.key);
    const r = document.createElement('div'); r.className='r';
    r.innerHTML = `<i style="background:${su.hex}"></i>${su.name}<div class="rb"><i style="background:${su.hex};width:${tot?v/tot*100:0}%"></i></div><b>${minLabel(v)}</b>`;
    rows.appendChild(r);
  });
  $('logMeta').textContent = `집중 세션 ${S.sessions[logDate]||0}회`;
}
$('editLog').onclick = ()=>{
  const rows = $('modalRows'); rows.innerHTML='';
  const l = dayLog(logDate);
  SUBJECTS.forEach(su=>{
    const r = document.createElement('div'); r.className='m-row';
    r.innerHTML = `<i style="background:${su.hex}"></i><b>${su.name}</b><input type="number" min="0" max="1440" data-k="${su.key}" value="${Math.round((l[su.key]||0)/60)}"><span>분</span>`;
    rows.appendChild(r);
  });
  $('modalBg').classList.add('show');
};
$('modalCancel').onclick = ()=>$('modalBg').classList.remove('show');
$('modalBg').onclick = e=>{ if(e.target===$('modalBg')) $('modalBg').classList.remove('show'); };
$('modalSave').onclick = ()=>{
  const l = dayLog(logDate);
  $('modalRows').querySelectorAll('input').forEach(inp=>{ l[inp.dataset.k]=Math.max(0,Number(inp.value)||0)*60; });
  saveState(); $('modalBg').classList.remove('show'); renderLog(); renderStat();
};

/* ---------- mock view ---------- */
function renderMock(){
  const wrap = $('mockList'); wrap.innerHTML='';
  SUBJECTS.forEach(su=>{
    const row = document.createElement('div');
    row.className = 'mrow'+(mockSubj===su.key?' on':'');
    row.style.setProperty('--kc', su.hex);
    row.innerHTML = `<b>${su.name}</b><span class="min"><input type="number" min="1" max="300" value="${S.mock.durations[su.key]}"> 분</span>`;
    const inp = row.querySelector('input');
    inp.onclick = e=>e.stopPropagation();
    inp.onchange = ()=>{
      S.mock.durations[su.key]=Math.min(300,Math.max(1,Number(inp.value)||1));
      inp.value=S.mock.durations[su.key]; saveState();
      if(mockSubj===su.key && !mockTimer) renderRing(S.mock.durations[su.key]*60, S.mock.durations[su.key]*60);
    };
    row.onclick = ()=>{
      if(mockTimer && mockTimer.running){ toast('진행 중엔 과목을 바꿀 수 없어요'); return; }
      mockSubj=su.key; stopMock(); renderMock();
    };
    wrap.appendChild(row);
  });
  renderRing(mockTimer?mockTimer.remain:S.mock.durations[mockSubj]*60, mockTimer?mockTimer.total:S.mock.durations[mockSubj]*60);
  renderVoice();
}
function renderRing(remain,total){
  $('mockTime').textContent = `${pad(Math.floor(remain/60))}:${pad(Math.floor(remain%60))}`;
  $('mockArc').style.strokeDashoffset = 502.7*(1-(total?remain/total:0));
  $('mockSubjLabel').textContent = SUBJ[mockSubj].name;
  $('mockArc').style.stroke = SUBJ[mockSubj].hex;
}
function speak(msg){
  if(!S.mock.voice || !('speechSynthesis' in window)) return;
  try{ const u=new SpeechSynthesisUtterance(msg); u.lang='ko-KR'; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}
function startMock(){
  if(mockTimer && mockTimer.running){
    clearInterval(mockTimer.intId); mockTimer.running=false; $('mockStart').textContent='계속'; return;
  }
  if(!mockTimer){
    const total=S.mock.durations[mockSubj]*60;
    mockTimer={remain:total,total,running:false,intId:null,announced:{}};
    speak(`${SUBJ[mockSubj].name} 모의고사 ${S.mock.durations[mockSubj]}분, 시작합니다.`);
  }
  mockTimer.running=true; $('mockStart').textContent='일시정지';
  mockTimer.intId=setInterval(()=>{
    mockTimer.remain--;
    [[600,'10분 남았습니다.'],[300,'5분 남았습니다.'],[60,'1분 남았습니다.']].forEach(([t,m])=>{
      if(mockTimer.remain===t && !mockTimer.announced[t]){ mockTimer.announced[t]=1; speak(m); }
    });
    if(mockTimer.remain<=0){
      clearInterval(mockTimer.intId);
      renderRing(0,mockTimer.total);
      speak('시험이 종료되었습니다.');
      toast('모의고사 종료');
      mockTimer=null; $('mockStart').textContent='시작'; return;
    }
    renderRing(mockTimer.remain,mockTimer.total);
  },1000);
}
function stopMock(){
  if(mockTimer){ clearInterval(mockTimer.intId); mockTimer=null; }
  $('mockStart').textContent='시작';
  renderRing(S.mock.durations[mockSubj]*60, S.mock.durations[mockSubj]*60);
}
$('mockStart').onclick = startMock;
$('mockReset').onclick = ()=>stopMock();
$('voiceBtn').onclick = ()=>{ S.mock.voice=!S.mock.voice; saveState(); renderVoice(); if(S.mock.voice) speak('음성 알림이 켜졌어요.'); };
function renderVoice(){
  const b=$('voiceBtn');
  b.classList.toggle('on', S.mock.voice);
  b.textContent = S.mock.voice ? '음성 알림 켜짐' : '음성 알림 꺼짐';
}

/* ---------- boot ---------- */
carryOver();
renderChrome();
renderTitle();
renderCurrent();
tick();

setInterval(()=>{
  if(S.timer){
    tick();
    if(view==='today') renderStat();
  }
},1000);
let bootDay = todayStr();
setInterval(()=>{
  if(todayStr()!==bootDay){
    bootDay = todayStr();
    if(S.timer && S.timer.date!==bootDay) endSession(true);
    carryOver(); selDate=todayStr(); logDate=todayStr(); weekAnchor=monday(new Date());
    renderChrome(); renderTitle(); renderCurrent();
  }
},15000);
</script>
